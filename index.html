<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>joy joyy 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffe4ee; --bg2:#ffc2d9; --card:#fff7fa; --ink:#8a1c4a; --soft:#c2547f;
  --pink:#ff5c9a; --pink-d:#e0287a; --line:#ffb3d1; --shadow:rgba(224,40,122,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#3a1228; --bg2:#5a1d3d; --card:#4a1832; --ink:#ffd6e8; --soft:#ff9cc4; --line:#8a3a62; --shadow:rgba(0,0,0,.4);}
}
:root[data-theme="dark"]{--bg1:#3a1228; --bg2:#5a1d3d; --card:#4a1832; --ink:#ffd6e8; --soft:#ff9cc4; --line:#8a3a62; --shadow:rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:"Quicksand",system-ui,sans-serif; color:var(--ink);
  background:radial-gradient(circle at 20% 10%,var(--bg1),var(--bg2));
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.float{position:fixed; top:-10%; pointer-events:none; animation:fall linear forwards; z-index:0}
@keyframes fall{to{transform:translateY(120vh) rotate(360deg)}}
.screen{position:relative; z-index:1; width:min(92vw,380px); display:none; text-align:center}
.screen.on{display:block}
.card{
  position:relative; background:var(--card); border:3px dashed var(--line);
  border-radius:32px; padding:44px 26px 34px; box-shadow:0 14px 40px var(--shadow);
}
.card::before,.card::after{position:absolute; font-size:34px}
.card::before{content:"🌸"; top:-18px; left:-12px; transform:rotate(-15deg)}
.card::after{content:"💗"; top:-18px; right:-12px; transform:rotate(15deg)}
.corner{position:absolute; bottom:-16px; font-size:30px}
.corner.l{left:-10px} .corner.r{right:-10px}
h1{font-family:"Pacifico",cursive; font-weight:400; font-size:2.1rem; margin:0 0 6px; color:var(--pink-d)}
.sub{margin:0 0 22px; color:var(--soft); font-weight:700}
.field{position:relative; margin:0 0 14px}
.field span{position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:20px}
.field input{
  width:100%; font:inherit; font-weight:700; color:var(--ink); background:transparent;
  border:2px solid var(--line); border-radius:999px; padding:14px 18px 14px 46px; outline:none;
}
.field input::placeholder{color:var(--soft); opacity:.7}
.field input:focus{border-color:var(--pink); box-shadow:0 0 0 4px var(--shadow)}
.btn{
  margin-top:8px; width:100%; border:0; cursor:pointer; font:inherit; font-weight:700; font-size:1.15rem;
  color:#fff; background:linear-gradient(135deg,var(--pink),var(--pink-d)); border-radius:999px;
  padding:15px 20px; box-shadow:0 8px 20px var(--shadow); transition:transform .15s;
}
.btn:active{transform:scale(.95)}
.btn:focus-visible,.tap:focus-visible{outline:3px solid var(--pink-d); outline-offset:4px}
.divider{margin:18px 0 0; letter-spacing:.4em; font-size:16px}
/* page 2 */
.tap{
  background:none; border:0; cursor:pointer; font-family:"Pacifico",cursive; font-size:4.2rem; line-height:1.1;
  color:var(--pink-d); text-shadow:0 6px 0 var(--line); padding:20px;
  animation:pulse 1.4s ease-in-out infinite;
}
.tap small{display:block; font-family:"Quicksand",sans-serif; font-size:1.8rem; margin-top:6px; text-shadow:none}
@keyframes pulse{0%,100%{transform:scale(.85)}50%{transform:scale(1.2)}}
.hint{color:var(--soft); font-weight:700; margin-top:10px}
.msg{display:none}
.msg.on{display:block; animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6); opacity:0}to{transform:scale(1); opacity:1}}
.msg h2{font-family:"Pacifico",cursive; font-weight:400; color:var(--pink-d); font-size:1.7rem; margin:0 0 14px}
.msg p{font-size:1.15rem; line-height:1.65; font-weight:500; margin:0 0 16px; white-space:pre-line}
.msg .sign{font-family:"Pacifico",cursive; font-size:1.3rem; color:var(--pink-d)}
@media (prefers-reduced-motion:reduce){.tap{animation:none}.float{display:none}}

.photo{position:relative; margin:4px auto 18px; width:min(100%,150px); padding:6px 6px 8px; background:#fff; border:2px solid var(--line); border-radius:18px; box-shadow:0 8px 22px var(--shadow); transform:rotate(-2deg)}
.photo img{display:block; width:100%; height:auto; border-radius:10px}
.photo::before,.photo::after{position:absolute; font-size:20px; top:-12px}
.photo::before{content:"🌸"; left:-12px}
.photo::after{content:"💗"; right:-12px}
.photo .cap{display:block; margin-top:8px; font-family:"Pacifico",cursive; color:var(--pink-d); font-size:.8rem}
</style>
</head>
<body>

<!-- Screen 1: login (no password needed) -->
<main class="screen on" id="login">
  <div class="card">
    <h1>Hi, my baby babiii</h1>
    <p class="sub">🌸 Tap baby, i have something for you!! 🌸</p>
    <button class="btn" id="loginBtn">🌸 Login 💗</button>
    <div class="divider">🌸💗🌸💗🌸</div>
    <span class="corner l">💗</span><span class="corner r">🌸</span>
  </div>
</main>

<!-- Screen 2: TAP IT, then message -->
<main class="screen" id="next">
  <div class="card">
    <div id="tapBox">
      <button class="tap" id="tapBtn" aria-label="Tap it">TAP IT<small>🌸💗🌸</small></button>

<script>
/* ✏️ EDIT YOUR MESSAGE HERE */
const MESSAGE = "I made this baby just for you, a little effort of me po\n\nhi babyy, i hope you're doing okay today, tomorrow, basta dapat everyday. and please don't forget to take care of yourself ha, bantay lang. and always remember that im here for you. iloveyouuuu so much, babyyy.❤️🫶🏻\n\nYou’re my lovey, always.";
const SIGN = "Love, kentoy 💗";

const $ = id => document.getElementById(id);
const bits = ["🌸","💗","🌷","💕","🌺","💖"];

function drift(n){
  for(let i=0;i<n;i++){
    const s=document.createElement("div");
    s.className="float";
    s.textContent=bits[Math.floor(Math.random()*bits.length)];
    s.style.left=Math.random()*100+"vw";
    s.style.fontSize=(16+Math.random()*22)+"px";
    s.style.opacity=.55+Math.random()*.4;
    s.style.animationDuration=(7+Math.random()*7)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),15000);
  }
}
drift(10);
setInterval(()=>drift(2),1800);

$("loginBtn").addEventListener("click",()=>{
  $("login").classList.remove("on");
  $("next").classList.add("on");
  drift(14);
});

$("tapBtn").addEventListener("click",()=>{
  $("tapBox").style.display="none";
  $("msgText").textContent=MESSAGE;
  $("sign").textContent=SIGN;
  $("msg").classList.add("on");
  drift(30);
});
</script>
